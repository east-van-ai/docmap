[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmap"
version = "0.2.1"
description = "Walk a Python project and emit a YAML manifest of every function and class, paired with its first docstring sentence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Go Nakamaru" }]
keywords = ["cli", "ast", "documentation", "codebase-mapping"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

# Local tooling, never shipped. A dependency group stays out of the wheel and
# off PyPI, which an optional-dependencies extra would not. Install with
# `pip install -e . --group dev` (needs pip 25.1+). The ruff and black pins are
# exact on purpose: the pin is what freezes ruff's default rule set.
[dependency-groups]
dev = [
    "black==25.11.0",
    "pytest",
    "pytest-cov",
    "ruff==0.16.0",
]

[project.urls]
Homepage = "https://github.com/east-van-ai/docmap"

[project.scripts]
docmap = "docmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
# Capture at the sys level, not the file descriptor level. fd capture
# intercepts descriptors 1 and 2, which a child process inherits, so it
# changes what the subprocess-based integration tests actually see.
# Deliberate, and kept.
addopts = "--capture=sys"
testpaths = ["tests"]